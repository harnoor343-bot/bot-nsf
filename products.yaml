# Products the bot watches.
#
# Every entry here is a listing SOLD BY THE RETAILER ITSELF. The bot also
# double-checks the seller on Amazon and Walmart (which have marketplaces) and
# will NOT email you if a third-party seller holds the listing.
#
# To add a product: copy an entry, change the name/url (or sku/asin), done.
# To stop watching one: delete it or put "enabled: false" on it.
#
# Fields:
#   retailer: bestbuy | amazon | walmart | costco | ebgames
#   model:    free text used in the email (e.g. "PS5 Pro")
#   name:     what shows up in the email
#   url:      product page (what the email links to)
#   sku:      Best Buy web code (Best Buy only)
#   asin:     Amazon ASIN (Amazon only)

