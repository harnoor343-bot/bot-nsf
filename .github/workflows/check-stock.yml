name: PS5 stock check

on:
  schedule:
    # Backup only: each run starts the next one itself (see "Queue next check").
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Just send a test alert (phone push / email)"
        type: boolean
        default: false

concurrency:
  group: ps5-stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'ps5-alerts-0f701b06d64b' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      STATE_FILE: state/state.json
      DEBUG_DIR: debug
      REMIND_HOURS: ${{ vars.REMIND_HOURS }}
      HEALTH_ALERT_AFTER: ${{ vars.HEALTH_ALERT_AFTER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Send test alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
        run: python bot.py --test-email

      - name: Restore bot memory
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ps5-state-${{ github.run_id }}
          restore-keys: ps5-state-

      - name: Check stock
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        run: python bot.py --loop-minutes 10 --interval 60

      - name: Save bot memory
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: ps5-state-${{ github.run_id }}

      # Pages the bot couldn't read (if any) - download from the run page to get the parser fixed.
      - name: Save unreadable pages
        if: ${{ always() && hashFiles('debug/*.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unreadable-pages
          path: debug/
          retention-days: 7

      # Start the next check as soon as this one ends, so the bot keeps running
      # even when GitHub skips scheduled runs. Disable the workflow to stop it.
      - name: Queue next check
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.test_email) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check-stock.yml --ref "${{ github.ref_name }}"
